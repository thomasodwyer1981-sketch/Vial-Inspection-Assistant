<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon background: dark navy -->
  <rect width="180" height="180" rx="40" fill="#0E1E35"/>

  <!-- Phone body -->
  <rect x="48" y="22" width="84" height="136" rx="14" fill="none" stroke="url(#phoneGrad)" stroke-width="4.5"/>

  <!-- Phone notch / top speaker -->
  <rect x="72" y="30" width="36" height="7" rx="3.5" fill="url(#phoneGrad)" opacity="0.6"/>

  <!-- Green scan corner brackets — top-left -->
  <path d="M62 58 L62 50 L70 50" stroke="#4CD964" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- top-right -->
  <path d="M118 58 L118 50 L110 50" stroke="#4CD964" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- bottom-left -->
  <path d="M62 112 L62 120 L70 120" stroke="#4CD964" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- bottom-right -->
  <path d="M118 112 L118 120 L110 120" stroke="#4CD964" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Vial body -->
  <rect x="81" y="68" width="18" height="38" rx="9" fill="#B3E8FF" fill-opacity="0.15" stroke="#B3E8FF" stroke-width="2"/>
  <!-- Liquid fill (~60%) -->
  <path d="M83 90 L83 98 Q83 104 90 104 Q97 104 97 98 L97 90 Z" fill="url(#liquidGrad)" fill-opacity="0.9"/>
  <!-- Vial neck -->
  <rect x="85" y="54" width="10" height="17" rx="3" fill="#B3E8FF" fill-opacity="0.12" stroke="#B3E8FF" stroke-width="2"/>
  <!-- Cap -->
  <rect x="82" y="47" width="16" height="10" rx="3.5" fill="url(#phoneGrad)"/>
  <!-- Shine line -->
  <line x1="84" y1="72" x2="84" y2="96" stroke="white" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Home button circle -->
  <circle cx="90" cy="146" r="7" fill="none" stroke="url(#phoneGrad)" stroke-width="2.5"/>

  <defs>
    <linearGradient id="phoneGrad" x1="48" y1="22" x2="132" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2EDFC8"/>
      <stop offset="100%" stop-color="#1BAB98"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="83" y1="90" x2="97" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60C8F0"/>
      <stop offset="100%" stop-color="#3AAAE0"/>
    </linearGradient>
  </defs>
</svg>
