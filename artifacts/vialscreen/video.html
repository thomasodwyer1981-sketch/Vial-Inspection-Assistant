<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PepScan Demo Video</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }

      #rec-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      #rec-overlay h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      #rec-overlay p  { font-size: 13px; color: rgba(255,255,255,0.55); max-width: 300px; text-align: center; line-height: 1.5; }
      #rec-btn {
        margin-top: 8px;
        padding: 14px 32px;
        background: #1db954;
        color: #000;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: transform 0.15s, opacity 0.15s;
      }
      #rec-btn:hover  { transform: scale(1.04); }
      #rec-btn:active { transform: scale(0.97); opacity: 0.85; }
      #rec-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

      #rec-status {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(255,0,60,0.9);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 999px;
        letter-spacing: 0.04em;
        display: none;
        gap: 6px;
        align-items: center;
      }
      #rec-status.visible { display: flex; }
      #rec-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #fff;
        animation: blink 1s infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Recording overlay — shown before playback starts -->
    <div id="rec-overlay">
      <h2>PepScan Demo Video</h2>
      <p>Click below to start recording. When prompted, select <strong>this tab</strong> to capture — the video will download automatically after one full loop (~21 s).</p>
      <button id="rec-btn">⬤ Record &amp; Download</button>
      <p style="font-size:11px;color:rgba(255,255,255,0.3);">Saves as a .webm file · works in Chrome &amp; Edge</p>
    </div>

    <!-- Live indicator shown during recording -->
    <div id="rec-status"><span id="rec-dot"></span>REC</div>

    <script>
      (function () {
        const overlay  = document.getElementById('rec-overlay');
        const btn      = document.getElementById('rec-btn');
        const status   = document.getElementById('rec-status');

        let mediaRecorder = null;
        let chunks = [];

        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Starting…';

          let stream;
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { frameRate: 30, displaySurface: 'browser' },
              audio: false,
            });
          } catch (e) {
            btn.disabled = false;
            btn.textContent = '⬤ Record & Download';
            alert('Screen capture was cancelled or denied. Please try again and select this tab.');
            return;
          }

          // Pick best supported codec
          const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
            .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

          mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
          chunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(chunks, { type: mimeType });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'pepscan-demo.webm';
            a.click();
            URL.revokeObjectURL(url);
            status.classList.remove('visible');
          };

          // Wire up the hooks the React video player calls
          window.startRecording = () => {
            if (mediaRecorder && mediaRecorder.state === 'inactive') {
              mediaRecorder.start(100); // 100ms timeslice for smooth chunks
              status.classList.add('visible');
            }
          };
          window.stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          };

          // Hide overlay and kick off the video
          overlay.style.display = 'none';
          // Small delay so the page is fully visible before recording starts
          setTimeout(() => {
            // Dispatch a custom event so the React app can re-mount / reset if needed
            window.dispatchEvent(new Event('rec-ready'));
          }, 200);
        });

        // Skip recording — just watch
        overlay.insertAdjacentHTML('beforeend',
          '<button id="skip-btn" style="background:transparent;border:none;color:rgba(255,255,255,0.35);font-size:12px;cursor:pointer;margin-top:4px;font-family:system-ui">Just watch (no download)</button>'
        );
        document.getElementById('skip-btn').addEventListener('click', () => {
          overlay.style.display = 'none';
        });
      })();
    </script>

    <script type="module" src="/src/main-video.tsx"></script>
  </body>
</html>
