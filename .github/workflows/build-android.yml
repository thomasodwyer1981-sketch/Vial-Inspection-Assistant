name: Build Android AAB

on:
  workflow_dispatch: # Run manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Extract version name from build.gradle
        id: version
        working-directory: artifacts/vialscreen/android/app
        run: |
          VERSION=$(grep 'versionName' build.gradle | grep -oP '"[^"]+"' | tr -d '"')
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Build web app
        run: pnpm --filter @workspace/vialscreen run build
        env:
          VITE_API_BASE_URL: https://pepscan.replit.app
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          PORT: "3000"
          BASE_PATH: "/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        working-directory: artifacts/vialscreen
        run: npx cap sync android

      - name: Inject google-services.json (Firebase Analytics)
        env:
          GSVC: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSVC" ]; then
            echo "$GSVC" | base64 -d \
              > artifacts/vialscreen/android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — Firebase Analytics disabled for this build"
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/pepscan-key.jks

      - name: Build signed AAB
        working-directory: artifacts/vialscreen/android
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/pepscan-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Guard — fail on mixed Sentry versions in AAB
        run: |
          cd artifacts/vialscreen/android/app/build/outputs/bundle/release
          unzip -o -q app-release.aab "BUNDLE-METADATA/*" -d /tmp/aabmeta
          PB=/tmp/aabmeta/BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb
          # All io.sentry Java/Android modules must resolve to ONE version.
          # Mixed versions abort at process start = instant crash on launch.
          # (0.x = sentry-native-ndk, the C library — separate product line, excluded.)
          VERSIONS=$(strings "$PB" | grep -A2 '^io\.sentry$' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | grep -v '^0\.' | sort -u)
          echo "Sentry versions packaged:"; echo "$VERSIONS"
          if [ "$(echo "$VERSIONS" | wc -l)" -ne 1 ]; then
            echo "::error::Mixed io.sentry versions packaged — this crashes the app at launch. Keep autoInstallation disabled in the sentry{} block and never declare io.sentry:sentry-android explicitly (see app/build.gradle notes)."
            exit 1
          fi

      - name: Upload AAB (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: pepscan-release
          path: artifacts/vialscreen/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload AAB to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pepscan.app
          releaseFiles: artifacts/vialscreen/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          # whatsNewDirectory is optional — add release notes per locale if needed
