name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # SMOKE TEST — boot iOS 26 simulator, install the app, verify it stays alive
  # for 5 seconds.  The archive/upload job is gated on this job succeeding, so
  # a launch crash can never reach App Store Connect reviewers.
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: iOS 26 launch smoke test
    # macos-26 ships with Xcode 26 and the iOS 26 simulator runtime pre-installed.
    # Do NOT use macos-latest here — it is a mutable label that currently resolves
    # to macOS 15 / Xcode 16, which only carries iOS 18 simulators.
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Explicitly select the Xcode that ships with the iOS 26 SDK.
      # The macos-26 runner may have multiple Xcode installations; picking
      # the highest Xcode_26.x version ensures simctl always sees iOS 26 runtimes.
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls /Applications | grep -E '^Xcode_?26' | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "/Applications/${XCODE_PATH}/Contents/Developer"
          else
            # macos-26 default Xcode should already be correct; confirm it.
            echo "No versioned Xcode_26* found — using default Xcode."
          fi
          xcodebuild -version
          echo "--- Available iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/vialscreen run build
        env:
          VITE_API_BASE_URL: https://pepscan.replit.app
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APPSFLYER_APPLE_APP_ID: ${{ secrets.VITE_APPSFLYER_APPLE_APP_ID }}
          PORT: "3000"
          BASE_PATH: "/"

      - name: Sync Capacitor → iOS
        working-directory: artifacts/vialscreen
        run: npx cap sync ios

      - name: Inject GoogleService-Info.plist (Firebase Analytics)
        env:
          GSVC_IOS: ${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GSVC_IOS" ]; then
            echo "$GSVC_IOS" | base64 -d \
              > artifacts/vialscreen/ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected"
          else
            echo "GOOGLESERVICE_INFO_PLIST_BASE64 not set — Firebase Analytics disabled for this build"
          fi

      - name: Resolve Swift Package dependencies
        working-directory: artifacts/vialscreen/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/SourcePackages

      # Find an available iOS 26 iPhone simulator. Fail early with a clear
      # message if the Xcode runtime isn't installed on this runner.
      - name: Find iOS 26 simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime and '26' in runtime:
                  for dev in devices:
                      if 'iPhone' in dev['name'] and dev.get('isAvailable', False):
                          print(dev['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No iOS 26 iPhone simulator found on this runner. Install the iOS 26 runtime in Xcode before running this workflow."
            exit 1
          fi
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "Found iOS 26 simulator: $UDID"

      # Debug build for the simulator — no code signing required.
      - name: Build app for iOS 26 Simulator (Debug)
        working-directory: artifacts/vialscreen/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Boot simulator and wait for ready
        run: |
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          # Boot is idempotent; ignore "already booted" error.
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          # bootstatus -b blocks until the simulator finishes booting.
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "Simulator $SIM_UDID is ready."

      - name: Install app on simulator
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "App.app" \
            -path "*/Debug-iphonesimulator/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App.app not found under DerivedData — xcodebuild may have failed silently."
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

      - name: Launch app and record PID
        id: launch
        run: |
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          echo "Launching com.pepscan.app …"
          LAUNCH_OUT=$(xcrun simctl launch "$SIM_UDID" com.pepscan.app 2>&1)
          echo "$LAUNCH_OUT"
          # simctl launch prints: "com.pepscan.app: <PID>"
          APP_PID=$(echo "$LAUNCH_OUT" | grep -oE '[0-9]+$' | head -1)
          if [ -z "$APP_PID" ]; then
            echo "::error::Could not parse PID from simctl launch output: $LAUNCH_OUT"
            exit 1
          fi
          echo "App launched with PID $APP_PID"
          echo "pid=$APP_PID" >> $GITHUB_OUTPUT

      - name: Wait 5 s then verify app is still running
        run: |
          APP_PID="${{ steps.launch.outputs.pid }}"
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          sleep 5
          # Simulator apps run as real macOS processes; kill -0 checks liveness
          # without sending a real signal.
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✅ Smoke test PASSED — com.pepscan.app (PID $APP_PID) is alive after 5 s"
          else
            echo "::error::Smoke test FAILED — com.pepscan.app (PID $APP_PID) exited within 5 s (likely a launch crash)"
            echo ""
            echo "=== Last 60 s of simulator logs ==="
            xcrun simctl spawn "$SIM_UDID" log show \
              --predicate 'process == "App" OR process == "SpringBoard"' \
              --last 60s 2>/dev/null || true
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # ARCHIVE & UPLOAD — only runs if the smoke test passes.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Archive and upload to App Store Connect
    needs: smoke-test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Extract version from build.gradle (shared source of truth)
        id: version
        working-directory: artifacts/vialscreen/android/app
        run: |
          VERSION=$(awk -F'"' '/versionName/{print $2; exit}' build.gradle)
          BUILD=$(awk '/[[:space:]]versionCode[[:space:]]/{print $2; exit}' build.gradle)
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$BUILD" >> $GITHUB_OUTPUT

      - name: Build web app
        run: pnpm --filter @workspace/vialscreen run build
        env:
          VITE_API_BASE_URL: https://pepscan.replit.app
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APPSFLYER_APPLE_APP_ID: ${{ secrets.VITE_APPSFLYER_APPLE_APP_ID }}
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          PORT: "3000"
          BASE_PATH: "/"

      - name: Sync Capacitor → iOS
        working-directory: artifacts/vialscreen
        run: npx cap sync ios

      - name: Inject GoogleService-Info.plist (Firebase Analytics)
        env:
          GSVC_IOS: ${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GSVC_IOS" ]; then
            echo "$GSVC_IOS" | base64 -d \
              > artifacts/vialscreen/ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected"
          else
            echo "GOOGLESERVICE_INFO_PLIST_BASE64 not set — Firebase Analytics disabled for this build"
          fi

      - name: Set version in Xcode project
        working-directory: artifacts/vialscreen/ios/App
        run: |
          xcrun agvtool new-marketing-version ${{ steps.version.outputs.name }}
          xcrun agvtool new-version -all ${{ steps.version.outputs.code }}

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/pepscan.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Resolve Swift Package dependencies
        working-directory: artifacts/vialscreen/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/SourcePackages

      - name: Build archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        working-directory: artifacts/vialscreen/ios/App
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/PepScan.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -d $RUNNER_TEMP/PepScan.xcarchive

      - name: Import provisioning profile for export
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > /tmp/pepscan.mobileprovision
          UUID=$(security cms -D -i /tmp/pepscan.mobileprovision 2>/dev/null | \
            plutil -extract UUID raw -)
          cp /tmp/pepscan.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "Profile imported: $UUID"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PepScan.xcarchive \
            -exportOptionsPlist artifacts/vialscreen/ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Export step done (destination=upload; no local export folder)"

      - name: Notify success
        run: echo "IPA uploaded to App Store Connect (TestFlight) via xcodebuild destination=upload"
