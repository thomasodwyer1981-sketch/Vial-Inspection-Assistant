name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: BASE_PATH=/ PORT=3000 pnpm --filter @workspace/vialscreen run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Sync Capacitor → Android
        run: |
          cd artifacts/vialscreen
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x artifacts/vialscreen/android/gradlew

      - name: Build debug APK
        run: |
          cd artifacts/vialscreen/android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pepscan-debug-apk
          path: artifacts/vialscreen/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
