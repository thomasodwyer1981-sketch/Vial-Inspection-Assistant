name: PepScan inspection record regressions

on:
  pull_request:
    paths:
      - "artifacts/vialscreen/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/inspection-records.yml"

permissions:
  contents: read

jobs:
  inspection-records:
    name: Inspection record regression checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run inspection record regression checks
        run: pnpm --filter @workspace/vialscreen run test:e2e
        env:
          CI: "true"